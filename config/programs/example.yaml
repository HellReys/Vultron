# Example configuration for Vultron.
# This is not an actual bug bounty authorization.

program:
  name: "Example Security Program"

scope:
  allowed:
    - "example.com"
    - "*.example.com"

  excluded:
    - "admin.example.com"
    - "*.internal.example.com"

scanning:
  enabled: false
  authorization_confirmed: false

  # Example limits only.
  # Replace with the actual program requirements.
  requests_per_second: 2
  max_concurrent_requests: 2
