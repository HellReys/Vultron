# Example bug bounty policy for Vultron.
# This configuration is for development and testing only.

program:
  name: "Example Security Program"

scope:
  allowed:
    - "example.com"
    - "*.example.com"

  excluded:
    - "admin.example.com"
    - "*.internal.example.com"

scanning:
  enabled: false
  authorization_confirmed: false

  requests_per_second: 2
  max_concurrent_requests: 2
  max_requests: 500

headers:
  User-Agent: "Vultron/0.1"
  X-Bug-Bounty-Researcher: "example-researcher"