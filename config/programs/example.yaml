program:
  name: "Example Security Program"

scope:
  allowed:
    - "example.com"
    - "*.example.com"

  excluded:
    - "admin.example.com"
    - "*.internal.example.com"

scanning:
  enabled: false
  authorization_confirmed: false
  requests_per_second: 2
  max_concurrent_requests: 2
  max_requests: 500

headers:
  User-Agent: "Vultron/2.0.0"
  X-Bug-Bounty-Researcher: "example-researcher"

tcp_scanning:
  enabled: false
  allowed_ports:
    - 80
    - 443
  connections_per_second: 2
  max_connections: 20
  banner_grabbing_enabled: false